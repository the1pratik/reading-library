<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your library — Pratik</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F2EB;--ink:#1f1c18;--mut:#8a8377;--line:#e3ddd1;--shelf:#cfc6b5;--card:#fbf9f4}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:"Libre Baskerville",Georgia,serif}
.wrap{max-width:1180px;margin:0 auto;padding:56px 28px 80px}
h1{font:400 clamp(38px,6vw,64px)/1.05 "Libre Baskerville",Georgia,serif;letter-spacing:-.02em;margin:0}
.stats{color:var(--mut);font-size:13px;margin-top:12px;display:flex;gap:14px;flex-wrap:wrap}
.bar{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 82%,transparent);padding:22px 0 14px;margin-top:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:#ebe6dc;border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 15px;border-radius:999px;font:500 13px Inter;color:var(--mut);cursor:pointer;transition:.25s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.search{flex:1;min-width:180px;border:1px solid var(--line);background:#fffdf8;border-radius:999px;padding:9px 16px;font:14px Inter;outline:none}
.search:focus{border-color:#bdb3a2}
select{border:1px solid var(--line);background:#fffdf8;border-radius:999px;padding:9px 14px;font:13px Inter;color:var(--ink)}
.pills{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
.pill{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fffdf8;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:#4a443c;transition:.2s}
.pill:hover{border-color:#bdb3a2}.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill i{width:8px;height:8px;border-radius:50%}.pill b{font-weight:500;color:var(--mut);font-variant-numeric:tabular-nums}.pill.on b{color:#bbb}
.sep{flex:none;width:1px;background:var(--line);margin:4px 4px}
/* shelf */
.shelf{display:flex;flex-wrap:wrap;align-items:flex-end;margin-top:26px;padding:0 4px}
.slot{height:250px;display:flex;align-items:flex-end;justify-content:center;border-bottom:5px solid var(--shelf);box-shadow:0 6px 8px -6px rgba(60,40,10,.25);overflow:visible;transition:width .55s cubic-bezier(.6,.05,.3,1)}
.spine{position:relative;border-radius:3px 3px 1px 1px;cursor:pointer;color:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;overflow:hidden;
 box-shadow:inset 3px 0 0 rgba(255,255,255,.08),inset -4px 0 6px rgba(0,0,0,.18),0 1px 0 rgba(0,0,0,.1);transition:transform .3s cubic-bezier(.3,.7,.3,1),opacity .5s,filter .3s}
.spine:hover,.spine:focus-visible{transform:translateY(-10px);outline:none;filter:brightness(1.08)}
.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font:500 11.5px/1.15 Inter;letter-spacing:.02em;max-height:86%;overflow:hidden;text-overflow:ellipsis;padding:4px 0}
.spine:before,.spine:after{content:"";position:absolute;left:5px;right:5px;height:1px;background:rgba(255,255,255,.28)}.spine:before{top:12px}.spine:after{bottom:12px}
.spine .nw{position:absolute;top:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#f3d27a}
.tip{position:fixed;z-index:20;pointer-events:none;background:#1f1c18;color:#fff;border-radius:12px;padding:9px 13px;font-size:12.5px;max-width:260px;opacity:0;transform:translate(-50%,-100%) translateY(4px);transition:opacity .15s,transform .15s}
.tip.on{opacity:1;transform:translate(-50%,-100%) translateY(-6px)}
.tip:after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#1f1c18}
.tip strong{display:block;font:400 13.5px/1.3 "Libre Baskerville",serif;margin-bottom:3px}.tip em{font-style:normal;color:#aaa39a}
.empty{color:var(--mut);padding:60px 0;text-align:center}
/* topics */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:26px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 14px;cursor:pointer;animation:pop .5s both cubic-bezier(.2,.8,.2,1);transition:transform .25s,box-shadow .25s}
.tcard:hover{transform:translateY(-3px);box-shadow:0 10px 24px -14px rgba(60,40,10,.35)}
.tcard h3{font:400 21px "Libre Baskerville",serif;margin:0 0 2px;display:flex;align-items:center;gap:9px}.tcard h3 i{width:10px;height:10px;border-radius:50%}
.tcard small{color:var(--mut)}.tcard .mini{display:flex;gap:3px;align-items:flex-end;height:54px;margin:12px 0 10px}.tcard .mini div{border-radius:2px 2px 0 0}
.tcard ul{margin:0;padding:0;list-style:none;font-size:13px;color:#4a443c}.tcard li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 0}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}}
/* toast */
.toast{position:fixed;top:18px;left:50%;z-index:30;transform:translate(-50%,-80px);background:#1f1c18;color:#fff;border-radius:999px;padding:9px 18px 9px 14px;font-size:13.5px;display:flex;gap:9px;align-items:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);transition:transform .6s cubic-bezier(.2,.9,.2,1.2)}
.toast.on{transform:translate(-50%,0)}.toast i{width:8px;height:8px;border-radius:50%;background:#f3d27a;box-shadow:0 0 0 4px rgba(243,210,122,.25)}
/* book */
.ov{position:fixed;inset:0;z-index:40;background:rgba(245,242,235,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;transition:opacity .45s;perspective:2200px}
.ov.on{opacity:1}
.book{position:absolute;transform-origin:0 0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.65,0,.35,1)}
.pg{position:absolute;inset:0;background:#fcfaf5;border-radius:2px 8px 8px 2px;box-shadow:0 30px 60px -20px rgba(40,25,5,.45),0 2px 6px rgba(0,0,0,.08);overflow:auto;padding:34px 30px 28px}
.pg:before{content:"";position:absolute;left:0;top:0;bottom:0;width:22px;background:linear-gradient(90deg,rgba(0,0,0,.08),transparent)}
.cover{position:absolute;inset:0;transform-origin:0 50%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.65,0,.35,1) .12s}
.book.open .cover{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:2px 8px 8px 2px}
.front{color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:40px 30px;box-shadow:inset 6px 0 10px rgba(0,0,0,.2),0 30px 60px -20px rgba(40,25,5,.5)}
.front h2{font:400 26px/1.25 "Libre Baskerville",serif;margin:0}.front p{margin:0;opacity:.8;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.back{transform:rotateY(180deg);background:#f7f3ea;border-radius:8px 2px 2px 8px;display:flex;align-items:center;justify-content:center;box-shadow:inset -18px 0 22px -12px rgba(0,0,0,.15)}
.stamp{border:1.5px solid #8a7a62;color:#6d5d45;border-radius:50%;width:150px;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:rotate(-8deg)}
.stamp b{font:italic 400 22px "Libre Baskerville",serif}.stamp small{font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-top:6px;max-width:110px}
.pg .src{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.pg h2{font:400 24px/1.25 "Libre Baskerville",serif;margin:8px 0 4px}.pg .by{color:var(--mut);font-size:13.5px;margin-bottom:18px}
.pg h4{font:600 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:18px 0 6px}
.pg ol{margin:0;padding-left:18px;font:14.5px/1.55 "Libre Baskerville",serif}.pg li{margin:5px 0}
.pg .q{font:italic 15px/1.5 "Libre Baskerville",serif;border-left:2px solid #c9a96b;padding-left:12px}
.pg textarea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px;font:14px Inter;resize:vertical}
.read{display:inline-flex;gap:8px;align-items:center;margin-top:16px;background:#1f1c18;color:#fff;text-decoration:none;border-radius:999px;padding:10px 20px;font:500 14px Inter;transition:transform .2s}.read:hover{transform:translateX(3px)}
.x{position:absolute;top:14px;right:14px;border:0;background:#fff;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.content{opacity:0;transition:opacity .35s .45s}.book.open .content{opacity:1}
@media (max-width:760px){.wrap{padding:34px 16px 60px}.slot{height:200px}.book.open .cover{opacity:0;transition:transform .7s cubic-bezier(.65,0,.35,1) .12s,opacity .2s .6s}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important;transition-delay:0s!important}}
</style></head><body>
<div class="wrap">
<h1>Your library</h1>
<div class="stats" id="stats"></div>
<div class="bar"><div class="row">
<div class="seg" id="view"><button data-v="shelf" class="on">Shelf</button><button data-v="topics">Topics</button></div>
<input class="search" id="q" placeholder="Search titles, authors, ideas…">
<select id="sort"><option value="new">Newest</option><option value="title">Title</option><option value="short">Shortest</option><option value="long">Longest</option></select>
</div><div class="pills" id="pills"></div></div>
<div id="main"></div>
</div>
<div class="tip" id="tip"></div><div class="toast" id="toast"><i></i><span></span></div>
<script>
const D=/*DATA*/[];
const PAL=['#5b3a4f','#6b6a3a','#4a3426','#33363a','#a5573c','#3e4f5c','#7a4b3a','#58603f','#2f3b35','#8c6a3e','#6e3b3b','#46405e'];
const SRCC={Essay:'#4a3426',Podcast:'#5b3a4f',Newsletter:'#a5573c',Instagram:'#6e3b3b',X:'#33363a',Pick:'#6b6a3a'};
const h=s=>{let x=0;for(const c of s)x=(x*31+c.charCodeAt(0))|0;return Math.abs(x)};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const tagCol=t=>PAL[h(t)%PAL.length];
let st={v:'shelf',q:'',sort:'new',f:null};
// living refresh: new = not in seen list (first visit: latest batch)
let seenRaw=localStorage.getItem('rl_seen'),seen=new Set(JSON.parse(seenRaw||'[]'));
const latest=D.map(d=>d.added).sort().pop();
const NEW=new Set(D.filter(d=>seenRaw?!seen.has(d.id):d.added===latest).map(d=>d.id));
localStorage.setItem('rl_seen',JSON.stringify(D.map(d=>d.id)));
let animating=NEW.size>0&&!RM;
const sources=[...new Set(D.map(d=>d.source))];
const tags={};D.forEach(d=>d.tags.forEach(t=>tags[t]=(tags[t]||0)+1));
const topTags=Object.entries(tags).sort((a,b)=>b[1]-a[1]);
$('#stats').innerHTML=`<span>${D.length} pieces</span><span>·</span><span>${Math.round(D.reduce((a,d)=>a+d.minutes,0)/60)} hours of reading</span><span>·</span><span>${sources.map(s=>D.filter(d=>d.source===s).length+' '+s.toLowerCase()+(s==='X'?'':'s')).join(', ')}</span>`;
function pills(){
 const p=(k,label,col,n)=>`<button class="pill${st.f===k?' on':''}" data-f="${esc(k||'')}">${col?`<i style="background:${col}"></i>`:''}${esc(label)} <b data-n="${n}" data-k="${esc(k||'')}">${n}</b></button>`;
 $('#pills').innerHTML=p(null,'All','',D.length)+sources.map(s=>p('src:'+s,s,SRCC[s]||'#888',D.filter(d=>d.source===s).length)).join('')+'<span class="sep"></span>'+topTags.map(([t,n])=>p(t,t,tagCol(t),n)).join('');
}
function list(){
 let L=D.filter(d=>{if(st.f){if(st.f.startsWith('src:')){if(d.source!==st.f.slice(4))return false}else if(!d.tags.includes(st.f))return false}
  if(!st.q)return true;return (d.title+' '+d.author+' '+d.tags.join(' ')+' '+d.ideas.join(' ')+' '+d.source).toLowerCase().includes(st.q)});
 const s={new:(a,b)=>(b.added>a.added)-(b.added<a.added)||0,title:(a,b)=>a.title.localeCompare(b.title),short:(a,b)=>a.minutes-b.minutes,long:(a,b)=>b.minutes-a.minutes}[st.sort];
 return L.slice().sort(s);
}
const dims=d=>{const w=Math.round(26+Math.min(d.minutes,90)/90*30);const H=170+(h(d.id)%60);return[w,H]};
const spineCol=d=>PAL[h(d.id+d.source)%PAL.length];
function shelf(){
 const L=list();if(!L.length){$('#main').innerHTML='<div class="empty serif">Nothing on this shelf yet.</div>';return}
 $('#main').innerHTML='<div class="shelf">'+L.map(d=>{const[w,H]=dims(d);const n=NEW.has(d.id);
  return `<div class="slot${n&&animating?' in':''}" data-w="${w+6}" style="width:${n&&animating?0:w+6}px"><div class="spine" tabindex="0" data-id="${d.id}" style="width:${w}px;height:${H}px;background:${spineCol(d)};${n&&animating?'opacity:0;transform:translateY(-40px)':''}">${n?'<em class="nw"></em>':''}<span>${esc(d.title)}</span></div></div>`}).join('')+'</div>';
}
function topics(){
 const T=st.q?topTags.filter(([t])=>t.toLowerCase().includes(st.q)||D.some(d=>d.tags.includes(t)&&d.title.toLowerCase().includes(st.q))):topTags;
 $('#main').innerHTML='<div class="topics">'+T.map(([t,n],i)=>{const I=D.filter(d=>d.tags.includes(t));
  return `<div class="tcard" data-t="${esc(t)}" style="animation-delay:${Math.min(i,20)*35}ms"><h3><i style="background:${tagCol(t)}"></i>${esc(t)}</h3><small>${n} piece${n>1?'s':''}</small>
  <div class="mini">${I.slice(0,14).map(d=>{const[w,H]=dims(d);return `<div style="width:${w/4.5}px;height:${H/4}px;background:${spineCol(d)}"></div>`}).join('')}</div>
  <ul>${I.slice(0,3).map(d=>`<li>${esc(d.title)}</li>`).join('')}</ul></div>`}).join('')+'</div>';
}
function render(){pills();st.v==='shelf'?shelf():topics()}
render();
// controls
$('#view').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.v=b.dataset.v;[...$('#view').children].forEach(x=>x.classList.toggle('on',x===b));render()};
$('#q').oninput=e=>{st.q=e.target.value.trim().toLowerCase();render()};
$('#sort').onchange=e=>{st.sort=e.target.value;render()};
$('#pills').onclick=e=>{const b=e.target.closest('.pill');if(!b)return;st.f=b.dataset.f||null;if(st.v!=='shelf'){st.v='shelf';[...$('#view').children].forEach(x=>x.classList.toggle('on',x.dataset.v==='shelf'))}render()};
$('#main').addEventListener('click',e=>{const c=e.target.closest('.tcard');if(c){st.f=c.dataset.t;st.v='shelf';[...$('#view').children].forEach(x=>x.classList.toggle('on',x.dataset.v==='shelf'));render();scrollTo({top:0,behavior:'smooth'});return}
 const s=e.target.closest('.spine');if(s)openBook(s)});
$('#main').addEventListener('keydown',e=>{const s=e.target.closest('.spine');if(s&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openBook(s)}});
// tooltip
const tip=$('#tip');
$('#main').addEventListener('mouseover',e=>{const s=e.target.closest('.spine');if(!s)return;const d=D.find(x=>x.id===s.dataset.id),r=s.getBoundingClientRect();
 tip.innerHTML=`<strong>${esc(d.title)}</strong>${esc(d.author)} <em>· ${d.minutes} min · ${d.source}</em>`;tip.style.left=r.left+r.width/2+'px';tip.style.top=r.top-14+'px';tip.classList.add('on')});
$('#main').addEventListener('mouseout',e=>{if(e.target.closest('.spine'))tip.classList.remove('on')});
addEventListener('scroll',()=>tip.classList.remove('on'),{passive:true});
// living refresh
function tick(el,from,to,ms){if(RM){el.textContent=to;return}const t0=performance.now();const f=t=>{const p=Math.min(1,(t-t0)/ms);el.textContent=Math.round(from+(to-from)*p);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
if(NEW.size){
 const tt=$('#toast');tt.querySelector('span').textContent=`${NEW.size} new since you last looked`;setTimeout(()=>tt.classList.add('on'),300);setTimeout(()=>tt.classList.remove('on'),5200);
 if(animating){
  const nd=D.filter(d=>NEW.has(d.id));
  document.querySelectorAll('.pill b').forEach(b=>{const k=b.dataset.k,n=+b.dataset.n;const m=nd.filter(d=>!k||(k.startsWith('src:')?d.source===k.slice(4):d.tags.includes(k))).length;if(m){b.textContent=n-m;setTimeout(()=>tick(b,n-m,n,NEW.size*160+400),700)}});
  const slots=[...document.querySelectorAll('.slot.in')];
  slots.forEach((sl,i)=>setTimeout(()=>{sl.style.width=sl.dataset.w+'px';const sp=sl.firstElementChild;setTimeout(()=>{sp.style.transition='transform .55s cubic-bezier(.2,.9,.3,1.15),opacity .45s';sp.style.opacity=1;sp.style.transform=''},260);
   setTimeout(()=>{sl.classList.remove('in');sp.style.transition=''},1000)},700+i*160));
  setTimeout(()=>animating=false,700+slots.length*160+1000);
 }
}
// book open (FLIP)
let cur=null;
function openBook(s){
 if(cur)return;tip.classList.remove('on');const d=D.find(x=>x.id===s.dataset.id),r=s.getBoundingClientRect();
 const vw=innerWidth,vh=innerHeight,narrow=vw<760;
 const W=narrow?Math.min(vw-32,420):Math.min(400,(vw-80)/2),H=Math.min(vh-60,narrow?640:560);
 const L=narrow?(vw-W)/2:vw/2,T=(vh-H)/2;
 const ov=document.createElement('div');ov.className='ov';const col=spineCol(d);const note=localStorage.getItem('rl_note_'+d.id)||'';
 ov.innerHTML=`<div class="book" style="width:${W}px;height:${H}px;left:${L}px;top:${T}px">
 <div class="pg"><div class="content"><div class="src">${esc(d.source)} · ${d.minutes} min read</div><h2>${esc(d.title)}</h2><div class="by">${esc(d.author)}</div>
 <h4>Key ideas</h4><ol>${d.ideas.map(k=>`<li>${esc(k)}</li>`).join('')}</ol><h4>Reflect</h4><div class="q">${esc(d.q)}</div>
 <h4>Your take</h4><textarea placeholder="Write a few lines…">${esc(note)}</textarea><br><a class="read" href="${esc(d.url)}" target="_blank" rel="noopener">Read →</a></div></div>
 <div class="cover"><div class="face front" style="background:${col}"><p>${esc(d.source)}</p><h2>${esc(d.title)}</h2><p>${esc(d.author)}</p></div>
 <div class="face back"><div class="stamp"><b>Ex Libris</b><small>Pratik · ${esc(d.tags[0]||'')}</small></div></div></div></div>
 <button class="x" aria-label="Close">✕</button>`;
 document.body.appendChild(ov);document.body.style.overflow='hidden';
 const bk=ov.querySelector('.book');
 const inv=()=>`translate(${r.left-L}px,${r.top-T}px) scale(${r.width/W},${r.height/H})`;
 bk.style.transition='none';bk.style.transform=inv();s.style.opacity=0;bk.offsetWidth;
 bk.style.transition='';requestAnimationFrame(()=>{ov.classList.add('on');bk.style.transform='';setTimeout(()=>bk.classList.add('open'),RM?0:420)});
 ov.querySelector('textarea').oninput=e=>localStorage.setItem('rl_note_'+d.id,e.target.value);
 const close=()=>{bk.classList.remove('open');setTimeout(()=>{const r2=s.getBoundingClientRect();bk.style.transform=`translate(${r2.left-L}px,${r2.top-T}px) scale(${r2.width/W},${r2.height/H})`;ov.classList.remove('on');
   setTimeout(()=>{s.style.opacity='';ov.remove();document.body.style.overflow='';cur=null;s.focus({preventScroll:true})},RM?0:700)},RM?0:600)};
 ov.onclick=e=>{if(e.target===ov||e.target.closest('.x'))close()};
 cur={close};
}
addEventListener('keydown',e=>{if(e.key==='Escape'&&cur)cur.close()});
</script></body></html>
